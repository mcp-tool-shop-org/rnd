name: Sync the newsletter to Hugging Face

# Mirrors the published newsletter issues to the Hugging Face dataset repo mcp-tool-shop/rnd-newsletter, after each
# successful Pages deploy of main, or by hand. It is not push-triggered, so it doesn't count against the two-file
# cap for push-triggered workflows (ci.yml and pages.yml).
#
# Standards compliance (0-3):
# - PIN_PER_STEP 2: every action is pinned to a commit SHA and huggingface_hub to an exact version; the build reads
#   only the commit the Pages deploy built (workflow_run head_sha) or main for a manual run.
# - ANDON_AUTHORITY 2: the build step fails on any unreadable or inconsistent issue file, and the upload step never
#   runs after a failed build.
# - NAMED_COMPENSATORS 2: see the table below.
# - DECOMPOSE_BY_SECRETS 2: the token is set only in the upload step; the build step runs without it.
# - UNCERTAINTY_GATED_HUMANS 2: issues reach main only after the Director's go; the first backfill is a manual
#   workflow_dispatch run that is reported to the Publisher.
# - EXTERNAL_VERIFIER: n/a, no specialized claims.
#
# Compensators:
# | Action                      | Undo                                                                  | State after undo                    | Owner |
# |-----------------------------|-----------------------------------------------------------------------|-------------------------------------|-------|
# | create_repo (first run)     | Delete the dataset repo in its Hugging Face settings                  | No dataset; the site is unaffected  | Mike  |
# | upload_folder commit        | Revert the commit in the Hugging Face repo's history, or delete files | The dataset as before the sync      | Mike  |
#
# The token is the repo secret RND_TOKEN. It is never printed.

on:
  workflow_run:
    workflows: ["Deploy site to GitHub Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build the dataset folder (no token)
        run: python3 -I site/scripts/hf_newsletter_sync.py build --out hf-out

      - name: Install huggingface_hub
        run: python -m pip install huggingface_hub==1.33.0

      - name: Upload to mcp-tool-shop/rnd-newsletter
        env:
          HF_TOKEN: ${{ secrets.RND_TOKEN }}
        run: python3 site/scripts/hf_newsletter_sync.py upload --out hf-out
