<text x="656.0" y="142.0" font-size="12" fill="#1f2430" text-anchor="start" font-weight="600">How the review changed it</text>
<text x="656.0" y="164.0" font-size="11" fill="#1f2430" text-anchor="start" font-weight="400">The first draft took 38 slots by lesson (T02, T03,</text>
<text x="656.0" y="180.0" font-size="11" fill="#1f2430" text-anchor="start" font-weight="400">T06, T07, T08). Only 12 of them could make a clean-trace</text>
<text x="656.0" y="196.0" font-size="11" fill="#1f2430" text-anchor="start" font-weight="400">copy. Argon, the outside reviewer, caught it.</text>
<text x="656.0" y="212.0" font-size="11" fill="#1f2430" text-anchor="start" font-weight="400">The fix takes every eligible slot there is</text>
<text x="656.0" y="228.0" font-size="11" fill="#1f2430" text-anchor="start" font-weight="400">in ten lessons, plus 11 even slots as</text>
<text x="656.0" y="244.0" font-size="11" fill="#1f2430" text-anchor="start" font-weight="400">controls: still 38 slots.</text>
<text x="24.0" y="511.0" font-size="10.5" fill="#5b6272" text-anchor="start" font-weight="400">Pre-registered: the slot list was frozen before any row was written.</text>
