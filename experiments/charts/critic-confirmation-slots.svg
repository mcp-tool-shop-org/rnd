<text x="24.0" y="34.0" font-size="17" fill="#1f2430" text-anchor="start" font-weight="600">The confirmation test&#x27;s 38 slots, chosen by what they can test</text>
<text x="24.0" y="56.0" font-size="11.5" fill="#5b6272" text-anchor="start" font-weight="400">Each lesson has eight reasoning (kind C) slots. The pipeline plants a mistake in odd-numbered slots and &quot;no mistake&quot; in even ones; a clean-trace copy needs a planted mistake and a decided answer.</text>
