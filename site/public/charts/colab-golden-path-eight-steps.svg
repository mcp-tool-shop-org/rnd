<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 308" role="img" aria-label="Process map of the eight-step Colab golden path across two rows of four boxes" font-family="system-ui, sans-serif" font-size="14">
<rect width="688" height="308" fill="#ffffff"/>
<text x="344" y="32" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="15">The eight-step Colab golden path: four pre-spend gates before the GPU runs</text>
<text x="344" y="52" text-anchor="middle" fill="#5b6272" font-size="12">Steps 1 to 4 check design, path and hashes before a paid card opens; steps 5 to 8 run and book</text>

<!-- Row 1: Pre-spend gates (Steps 1 to 4) -->
<rect x="24" y="74" width="144" height="76" rx="4" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
<text x="96" y="96" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="13">1. Design study</text>
<text x="96" y="116" text-anchor="middle" fill="#5b6272" font-size="11">1 card for the study</text>
<text x="96" y="133" text-anchor="middle" fill="#5b6272" font-size="11">Price central &amp; 90th</text>

<line x1="168" y1="112" x2="190" y2="112" stroke="#8a8f98" stroke-width="1.8"/>
<polygon points="190,112 182,108 182,116" fill="#8a8f98"/>

<rect x="190" y="74" width="144" height="76" rx="4" fill="#ffffff" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="262" y="96" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="13">2. CPU stub</text>
<text x="262" y="116" text-anchor="middle" fill="#5b6272" font-size="11">0.08 units/hr rate</text>
<text x="262" y="133" text-anchor="middle" fill="#2f7d5b" font-weight="600" font-size="11">Exact setup &amp; path</text>

<line x1="334" y1="112" x2="356" y2="112" stroke="#8a8f98" stroke-width="1.8"/>
<polygon points="356,112 348,108 348,116" fill="#8a8f98"/>

<rect x="356" y="74" width="144" height="76" rx="4" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
<text x="428" y="96" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="13">3. Launch request</text>
<text x="428" y="116" text-anchor="middle" fill="#5b6272" font-size="11">Input &amp; script shas</text>
<text x="428" y="133" text-anchor="middle" fill="#5b6272" font-size="11">Cap, wall &amp; diff</text>

<line x1="500" y1="112" x2="520" y2="112" stroke="#8a8f98" stroke-width="1.8"/>
<polygon points="520,112 512,108 512,116" fill="#8a8f98"/>

<rect x="520" y="74" width="144" height="76" rx="4" fill="#ffffff" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="592" y="96" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="13">4. Approval</text>
<text x="592" y="116" text-anchor="middle" fill="#5b6272" font-size="11">Peer checks the diff</text>
<text x="592" y="133" text-anchor="middle" fill="#2f7d5b" font-weight="600" font-size="11">Cap &gt; 90th price</text>

<!-- Connector from Step 4 to Step 5 -->
<polyline points="592,150 592,167 96,167 96,184" fill="none" stroke="#8a8f98" stroke-width="1.8"/>
<polygon points="96,184 92,176 100,176" fill="#8a8f98"/>

<!-- Row 2: Execution and booking (Steps 5 to 8) -->
<rect x="24" y="184" width="144" height="76" rx="4" fill="#ffffff" stroke="#b4532a" stroke-width="1.5"/>
<text x="96" y="206" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="13">5. Run window</text>
<text x="96" y="226" text-anchor="middle" fill="#5b6272" font-size="11">VM gate, wall &amp; cap</text>
<text x="96" y="243" text-anchor="middle" fill="#b4532a" font-weight="600" font-size="11">Exit trap stops VM</text>

<line x1="168" y1="222" x2="190" y2="222" stroke="#8a8f98" stroke-width="1.8"/>
<polygon points="190,222 182,218 182,226" fill="#8a8f98"/>

<rect x="190" y="184" width="144" height="76" rx="4" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
<text x="262" y="206" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="13">6. Close &amp; book</text>
<text x="262" y="226" text-anchor="middle" fill="#5b6272" font-size="11">Check fetched files</text>
<text x="262" y="243" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="11">Own rate × own time</text>

<line x1="334" y1="222" x2="356" y2="222" stroke="#8a8f98" stroke-width="1.8"/>
<polygon points="356,222 348,218 348,226" fill="#8a8f98"/>

<rect x="356" y="184" width="144" height="76" rx="4" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
<text x="428" y="206" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="13">7. Run record</text>
<text x="428" y="226" text-anchor="middle" fill="#5b6272" font-size="11">1 outcome record</text>
<text x="428" y="243" text-anchor="middle" fill="#5b6272" font-size="11">Matches ledger row</text>

<line x1="500" y1="222" x2="520" y2="222" stroke="#8a8f98" stroke-width="1.8"/>
<polygon points="520,222 512,218 512,226" fill="#8a8f98"/>

<rect x="520" y="184" width="144" height="76" rx="4" fill="#ffffff" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="592" y="206" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="13">8. Review</text>
<text x="592" y="226" text-anchor="middle" fill="#2f7d5b" font-weight="600" font-size="11">Accept into data</text>
<text x="592" y="243" text-anchor="middle" fill="#b4532a" font-weight="600" font-size="11">Fail = a finding</text>

<text x="344" y="286" text-anchor="middle" fill="#5b6272" font-size="12">Green borders mark pre-spend and acceptance gates; rust marks the paid GPU window and exit trap.</text>
</svg>
