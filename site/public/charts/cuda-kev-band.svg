<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 351" width="1140" height="351" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1140" height="351" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="17" fill="#1f2430" text-anchor="start" font-weight="600">Kev judge fine-tune: median step time by environment (RTX 5090, WSL)</text>
<text x="24.0" y="54.0" font-size="11.5" fill="#5b6272" text-anchor="start" font-weight="400">Measured against a band fixed before the run (≤ 1.25× the CUDA 12.8 reference). Lower is faster.</text>
<line x1="380.0" y1="96.0" x2="380.0" y2="216.0" stroke="#e3e6ec" stroke-width="1.0"/>
<text x="380.0" y="231.0" font-size="10" fill="#5b6272" text-anchor="middle" font-weight="400">0 s</text>
<line x1="535.0" y1="96.0" x2="535.0" y2="216.0" stroke="#e3e6ec" stroke-width="1.0"/>
<text x="535.0" y="231.0" font-size="10" fill="#5b6272" text-anchor="middle" font-weight="400">5 s</text>
<line x1="690.0" y1="96.0" x2="690.0" y2="216.0" stroke="#e3e6ec" stroke-width="1.0"/>
<text x="690.0" y="231.0" font-size="10" fill="#5b6272" text-anchor="middle" font-weight="400">10 s</text>
<line x1="845.0" y1="96.0" x2="845.0" y2="216.0" stroke="#e3e6ec" stroke-width="1.0"/>
<text x="845.0" y="231.0" font-size="10" fill="#5b6272" text-anchor="middle" font-weight="400">15 s</text>
<line x1="1000.0" y1="96.0" x2="1000.0" y2="216.0" stroke="#e3e6ec" stroke-width="1.0"/>
<text x="1000.0" y="231.0" font-size="10" fill="#5b6272" text-anchor="middle" font-weight="400">20 s</text>
<line x1="583.0" y1="96.0" x2="583.0" y2="216.0" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5,3"/>
<text x="583.0" y="246.0" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="400">speed gate ≤ 6.55 s</text>
<rect x="24.0" y="96.0" width="1086.0" height="30.0" fill="#f1f3f7" stroke="none"/>
<text x="28.0" y="110.0" font-size="12" fill="#1f2430" text-anchor="start" font-weight="600">CUDA 12.8 reference</text>
<text x="28.0" y="122.0" font-size="9.5" fill="#5b6272" text-anchor="start" font-weight="400">torch cu128</text>
<line x1="380.0" y1="111.0" x2="542.4" y2="111.0" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="542.4" cy="111.0" r="4.5" fill="#6b7280" stroke="#6b7280" stroke-width="1.6"/>
<text x="552.4" y="115.0" font-size="10.5" fill="#5b6272" text-anchor="start" font-weight="400">5.24 s</text>
<text x="28.0" y="140.0" font-size="12" fill="#1f2430" text-anchor="start" font-weight="600">CUDA 13.4, first try</text>
<text x="28.0" y="152.0" font-size="9.5" fill="#5b6272" text-anchor="start" font-weight="400">missing flash-linear-attention</text>
<line x1="380.0" y1="141.0" x2="961.2" y2="141.0" stroke="#b91c1c" stroke-width="2.0"/>
<circle cx="961.2" cy="141.0" r="4.5" fill="#b91c1c" stroke="#b91c1c" stroke-width="1.6"/>
<text x="971.2" y="145.0" font-size="10.5" fill="#5b6272" text-anchor="start" font-weight="400">18.75 s · FAILED the speed gate</text>
<rect x="24.0" y="156.0" width="1086.0" height="30.0" fill="#f1f3f7" stroke="none"/>
<text x="28.0" y="170.0" font-size="12" fill="#1f2430" text-anchor="start" font-weight="600">CUDA 13.4</text>
<text x="28.0" y="182.0" font-size="9.5" fill="#5b6272" text-anchor="start" font-weight="400">torch 2.16.0.dev20261008+cu134</text>
<line x1="380.0" y1="171.0" x2="549.0" y2="171.0" stroke="#2563eb" stroke-width="2.0"/>
<circle cx="549.0" cy="171.0" r="4.5" fill="#2563eb" stroke="#2563eb" stroke-width="1.6"/>
<text x="559.0" y="175.0" font-size="10.5" fill="#5b6272" text-anchor="start" font-weight="400">5.45 s · 149/149 agree with 12.8</text>
<text x="28.0" y="200.0" font-size="12" fill="#1f2430" text-anchor="start" font-weight="600">CUDA 13.4 + causal-conv1d</text>
<text x="28.0" y="212.0" font-size="9.5" fill="#5b6272" text-anchor="start" font-weight="400">kernel built for sm_120</text>
<line x1="380.0" y1="201.0" x2="528.8" y2="201.0" stroke="#15803d" stroke-width="2.0"/>
<circle cx="528.8" cy="201.0" r="4.5" fill="#15803d" stroke="#15803d" stroke-width="1.6"/>
<text x="538.8" y="205.0" font-size="10.5" fill="#5b6272" text-anchor="start" font-weight="400">4.80 s · 149/149 agree with 12.8</text>
<text x="24.0" y="307.0" font-size="10.5" fill="#5b6272" text-anchor="start" font-weight="400">The gain to 4.80 s comes from the causal-conv1d kernel, not from CUDA 13.4: plain 13.4 is a little slower than 12.8.</text>
<text x="24.0" y="322.0" font-size="10.5" fill="#5b6272" text-anchor="start" font-weight="400">Single 30-step smokes per environment. Source: mcp-tool-shop-org/rnd experiments/kev-judge-finetune/env/README.md (its median-step tables).</text>
<text x="24.0" y="337.0" font-size="10.5" fill="#5b6272" text-anchor="start" font-weight="400">Inputs pinned in experiments/charts/manifest.json.</text>
</svg>
