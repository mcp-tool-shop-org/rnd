<text x="24.0" y="459.0" font-size="10.5" fill="#5b6272" text-anchor="start" font-weight="400">On a 5090 row a negative change is a slower decode. On an NPU or iGPU row a positive change is a slower call. E4b&#x27;s rates are not comparable to E4&#x27;s.</text>
<text x="24.0" y="474.0" font-size="10.5" fill="#5b6272" text-anchor="start" font-weight="400">Block 1 aborted and is not included. An inconclusive row stays INCONCLUSIVE when a later block re-runs the pair. Different runs are separate rows and are never joined by a line.</text>
<text x="24.0" y="489.0" font-size="10.5" fill="#5b6272" text-anchor="start" font-weight="400">Source: experiments/e4b/results/ (e4b-block-2 harness f3f5e44; e4b-block-3 harness 426f106). Inputs pinned in experiments/charts/manifest.json.</text>
