<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 308" role="img" aria-label="Breakdown of the 30-item blind panel into 23 sound items and 7 ambiguous items, grouped by how agreement broke, alongside the 4 Track A trap items" font-family="system-ui, sans-serif" font-size="14">
<rect width="688" height="308" fill="#ffffff"/>
<text x="344" y="32" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="15">Grading the 30-item panel blind before grading the critic</text>
<text x="344" y="52" text-anchor="middle" fill="#5b6272" font-size="12">An item is sound only if both graders and its stored label agreed, and neither flagged it unclear</text>

<!-- Bar 1: 30 items split into 23 sound vs 7 ambiguous -->
<text x="24" y="80" fill="#1f2430" font-weight="600" font-size="13">30-item panel (10 per label): 23 sound, 7 ambiguous</text>
<rect x="24" y="90" width="490" height="32" rx="4" fill="#2f7d5b"/>
<text x="269" y="111" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="12">23 sound items (10 cannot_tell · 7 supported · 6 unsupported)</text>
<rect x="518" y="90" width="146" height="32" rx="4" fill="#b4532a"/>
<text x="591" y="111" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="12">7 ambiguous</text>

<!-- Bottom-left box: How the 7 ambiguous items broke the rule (x=24..424, width=400) -->
<rect x="24" y="140" width="400" height="148" rx="4" fill="#ffffff" stroke="#b4532a" stroke-width="1.5"/>
<text x="36" y="162" fill="#b4532a" font-weight="600" font-size="13">How the 7 ambiguous items broke the rule</text>
<text x="36" y="184" fill="#1f2430" font-weight="600" font-size="12">• Labels agreed, flagged unclear: 2 items</text>
<text x="44" y="201" fill="#5b6272" font-size="11">All three labels matched; a grader flagged it unclear.</text>
<text x="36" y="223" fill="#1f2430" font-weight="600" font-size="12">• Labels disagreed: 5 items</text>
<text x="44" y="240" fill="#5b6272" font-size="11">– Payroll-portal item: key supported; both read cannot_tell</text>
<text x="44" y="257" fill="#5b6272" font-size="11">– Guest-cap item: graders split (cannot_tell vs unsupported)</text>
<text x="44" y="274" fill="#5b6272" font-size="11">– 3 other items where a grader differed from the key</text>

<!-- Bottom-right box: The 4 Track A trap items (x=440..664, width=224) -->
<rect x="440" y="140" width="224" height="148" rx="4" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
<text x="452" y="162" fill="#1f2430" font-weight="600" font-size="13">4 Track A trap items</text>
<text x="452" y="184" fill="#2f7d5b" font-weight="600" font-size="11.5">3 of 4 broke their planted label</text>
<text x="452" y="204" fill="#5b6272" font-size="11">Removing the deciding fact made</text>
<text x="452" y="220" fill="#5b6272" font-size="11">the true label cannot_tell while</text>
<text x="452" y="236" fill="#5b6272" font-size="11">keeping the old stored answer;</text>
<text x="452" y="252" fill="#5b6272" font-size="11">blind grading caught the key</text>
<text x="452" y="268" fill="#5b6272" font-size="11">before any bench run.</text>
</svg>
