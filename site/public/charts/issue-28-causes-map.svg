<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 264" role="img" aria-label="Pipeline diagram from planner to writer to critic to refusal showing where each of the three causes of refusals enters" font-family="system-ui, sans-serif" font-size="14">
<rect width="688" height="264" fill="#ffffff"/>
<text x="344" y="30" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="15">Where the three causes of refusals enter the pipeline</text>

<!-- Top pipeline: Planner -> Writer -> Critic -> Refusal -->
<rect x="24" y="52" width="136" height="44" rx="4" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
<text x="92" y="72" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="13">Planner</text>
<text x="92" y="88" text-anchor="middle" fill="#5b6272" font-size="11">assigns side &amp; label</text>

<line x1="160" y1="74" x2="188" y2="74" stroke="#8a8f98" stroke-width="1.8"/>
<polygon points="188,74 180,70 180,78" fill="#8a8f98"/>

<rect x="188" y="52" width="136" height="44" rx="4" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
<text x="256" y="72" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="13">Writer</text>
<text x="256" y="88" text-anchor="middle" fill="#5b6272" font-size="11">drafts item to brief</text>

<line x1="324" y1="74" x2="352" y2="74" stroke="#8a8f98" stroke-width="1.8"/>
<polygon points="352,74 344,70 344,78" fill="#8a8f98"/>

<rect x="352" y="52" width="144" height="44" rx="4" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
<text x="424" y="72" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="13">Critic</text>
<text x="424" y="88" text-anchor="middle" fill="#5b6272" font-size="11">gives its own label</text>

<line x1="496" y1="74" x2="524" y2="74" stroke="#8a8f98" stroke-width="1.8"/>
<polygon points="524,74 516,70 516,78" fill="#8a8f98"/>

<rect x="524" y="52" width="140" height="44" rx="4" fill="#b4532a"/>
<text x="594" y="72" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="13">Refusal</text>
<text x="594" y="88" text-anchor="middle" fill="#ffffff" font-size="11">labels disagree</text>

<!-- Vertical connectors from pipeline stages to the three causes -->
<path d="M 92 96 L 92 114 L 130 114 L 130 126" fill="none" stroke="#b4532a" stroke-width="1.5"/>
<path d="M 256 96 L 256 114 L 130 114" fill="none" stroke="#b4532a" stroke-width="1.5"/>
<polygon points="130,126 126,118 134,118" fill="#b4532a"/>

<line x1="424" y1="96" x2="424" y2="126" stroke="#b4532a" stroke-width="1.5"/>
<polygon points="424,126 420,118 428,118" fill="#b4532a"/>

<line x1="594" y1="96" x2="594" y2="126" stroke="#2f7d5b" stroke-width="1.5"/>
<polygon points="594,126 590,118 598,118" fill="#2f7d5b"/>

<!-- Cause 2 card: at Planner / Writer (x=24..232, width=208) -->
<rect x="24" y="128" width="208" height="114" rx="4" fill="#ffffff" stroke="#b4532a" stroke-width="1.5"/>
<text x="34" y="148" fill="#b4532a" font-weight="600" font-size="11.5">Cause 2 · Planner &amp; writer</text>
<text x="34" y="166" fill="#1f2430" font-weight="600" font-size="12.5">The contradictory brief</text>
<text x="34" y="185" fill="#5b6272" font-size="11">7 cannot_tell writers told to</text>
<text x="34" y="201" fill="#5b6272" font-size="11">show a match and keep text</text>
<text x="34" y="217" fill="#5b6272" font-size="11">silent; 6 of 7 voted T14.</text>

<!-- Cause 1 card: at Critic (x=244..452, width=208) -->
<rect x="244" y="128" width="208" height="114" rx="4" fill="#ffffff" stroke="#b4532a" stroke-width="1.5"/>
<text x="254" y="148" fill="#b4532a" font-weight="600" font-size="11.5">Cause 1 · At the critic</text>
<text x="254" y="166" fill="#1f2430" font-weight="600" font-size="12.5">The missing definitions</text>
<text x="254" y="185" fill="#5b6272" font-size="11">Critic gets only 3 label names;</text>
<text x="254" y="201" fill="#5b6272" font-size="11">6 of 7 flips in 102 items cross</text>
<text x="254" y="217" fill="#5b6272" font-size="11">unsupported and cannot_tell.</text>

<!-- Cause 3 card: at Refusal (x=464..664, width=200) -->
<rect x="464" y="128" width="200" height="114" rx="4" fill="#ffffff" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="474" y="148" fill="#2f7d5b" font-weight="600" font-size="11.5">Cause 3 · At refusal</text>
<text x="474" y="166" fill="#1f2430" font-weight="600" font-size="12.5">The right refusals</text>
<text x="474" y="185" fill="#5b6272" font-size="11">Critic working as meant:</text>
<text x="474" y="201" fill="#5b6272" font-size="11">the defect is in the draft</text>
<text x="474" y="217" fill="#5b6272" font-size="11">(the payroll-portal draft).</text>
</svg>
