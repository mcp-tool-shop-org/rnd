<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 308" role="img" aria-label="False refusals on 23 sound items across the first run, the rerun, and pooled over all six seeds, compared against the half-of-A pass line" font-family="system-ui, sans-serif" font-size="14">
<rect width="688" height="308" fill="#ffffff"/>
<text x="344" y="32" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="15">B clears the half-of-A bar on seeds 0–2, then fails on seeds 3–5 and pooled</text>
<text x="344" y="52" text-anchor="middle" fill="#5b6272" font-size="12">False refusals on 23 sound items: B passes only if its refusals are at most half of A’s</text>
<g transform="translate(25.2 0)">

<text x="24" y="80" fill="#1f2430" font-weight="600" font-size="13">1. First run (seeds 0–2, 69 calls per prompt)</text>
<text x="234" y="104" text-anchor="end" fill="#5b6272" font-size="12">Prompt A (no definitions)</text>
<rect x="244" y="90" width="276" height="18" fill="#1f2430" opacity="0.10"/>
<rect x="244" y="90" width="138" height="18" fill="#8a8f98"/>
<text x="530" y="104" fill="#1f2430" font-size="12">9 of 69</text>

<text x="234" y="128" text-anchor="end" fill="#5b6272" font-size="12">Prompt B (with definitions)</text>
<rect x="244" y="114" width="276" height="18" fill="#1f2430" opacity="0.10"/>
<rect x="244" y="114" width="61.3" height="18" fill="#2f7d5b"/>
<line x1="313" y1="86" x2="313" y2="136" stroke="#1f2430" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="313" y="81" text-anchor="middle" fill="#5b6272" font-size="11">half of A (4.5)</text>
<text x="530" y="128" fill="#2f7d5b" font-weight="600" font-size="12">4 of 69 · passes</text>

<text x="24" y="162" fill="#1f2430" font-weight="600" font-size="13">2. Rerun (seeds 3–5, 69 calls per prompt)</text>
<text x="234" y="186" text-anchor="end" fill="#5b6272" font-size="12">Prompt A (no definitions)</text>
<rect x="244" y="172" width="276" height="18" fill="#1f2430" opacity="0.10"/>
<rect x="244" y="172" width="138" height="18" fill="#8a8f98"/>
<text x="530" y="186" fill="#1f2430" font-size="12">9 of 69</text>

<text x="234" y="210" text-anchor="end" fill="#5b6272" font-size="12">Prompt B (with definitions)</text>
<rect x="244" y="196" width="276" height="18" fill="#1f2430" opacity="0.10"/>
<rect x="244" y="196" width="107.3" height="18" fill="#b4532a"/>
<line x1="313" y1="168" x2="313" y2="218" stroke="#1f2430" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="313" y="163" text-anchor="middle" fill="#5b6272" font-size="11">half of A (4.5)</text>
<text x="530" y="210" fill="#b4532a" font-weight="600" font-size="12">7 of 69 · fails</text>

<text x="24" y="244" fill="#1f2430" font-weight="600" font-size="13">3. Pooled (all 6 seeds, 138 calls per prompt)</text>
<text x="234" y="268" text-anchor="end" fill="#5b6272" font-size="12">Prompt A (no definitions)</text>
<rect x="244" y="254" width="276" height="18" fill="#1f2430" opacity="0.10"/>
<rect x="244" y="254" width="276" height="18" fill="#8a8f98"/>
<text x="530" y="268" fill="#1f2430" font-size="12">18 of 138</text>

<text x="234" y="292" text-anchor="end" fill="#5b6272" font-size="12">Prompt B (with definitions)</text>
<rect x="244" y="278" width="276" height="18" fill="#1f2430" opacity="0.10"/>
<rect x="244" y="278" width="168.7" height="18" fill="#b4532a"/>
<line x1="382" y1="250" x2="382" y2="296" stroke="#1f2430" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="382" y="245" text-anchor="middle" fill="#5b6272" font-size="11">half of A (9)</text>
<text x="530" y="292" fill="#b4532a" font-weight="600" font-size="12">11 of 138 · fails</text>
</g>
</svg>
