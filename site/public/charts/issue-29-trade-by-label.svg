<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 308" role="img" aria-label="False refusals on 23 sound items over 6 seeds split by true label: cannot_tell 12 to 0 of 60, supported 5 to 5 of 42, and unsupported 1 to 6 of 36" font-family="system-ui, sans-serif" font-size="14">
<rect width="688" height="308" fill="#ffffff"/>
<text x="344" y="32" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="15">Definitions end cannot_tell refusals but start unsupported ones</text>
<text x="344" y="52" text-anchor="middle" fill="#5b6272" font-size="12">Pooled false refusals over 6 seeds on the 23 sound items, split by the item’s true label</text>

<text x="24" y="80" fill="#1f2430" font-weight="600" font-size="13">1. cannot_tell (10 sound items, 60 calls per prompt)</text>
<text x="234" y="104" text-anchor="end" fill="#5b6272" font-size="12">Prompt A (no definitions)</text>
<rect x="244" y="90" width="270" height="18" fill="#1f2430" opacity="0.10"/>
<rect x="244" y="90" width="54" height="18" fill="#b4532a"/>
<text x="524" y="104" fill="#b4532a" font-weight="600" font-size="12">12 of 60 refused</text>

<text x="234" y="128" text-anchor="end" fill="#5b6272" font-size="12">Prompt B (with definitions)</text>
<rect x="244" y="114" width="270" height="18" fill="#1f2430" opacity="0.10"/>
<text x="524" y="128" fill="#2f7d5b" font-weight="600" font-size="12">0 of 60 refused</text>

<text x="24" y="162" fill="#1f2430" font-weight="600" font-size="13">2. supported (7 sound items, 42 calls per prompt)</text>
<text x="234" y="186" text-anchor="end" fill="#5b6272" font-size="12">Prompt A (no definitions)</text>
<rect x="244" y="172" width="189" height="18" fill="#1f2430" opacity="0.10"/>
<rect x="244" y="172" width="22.5" height="18" fill="#8a8f98"/>
<text x="443" y="186" fill="#1f2430" font-size="12">5 of 42 refused</text>

<text x="234" y="210" text-anchor="end" fill="#5b6272" font-size="12">Prompt B (with definitions)</text>
<rect x="244" y="196" width="189" height="18" fill="#1f2430" opacity="0.10"/>
<rect x="244" y="196" width="22.5" height="18" fill="#8a8f98"/>
<text x="443" y="210" fill="#1f2430" font-size="12">5 of 42 refused</text>

<text x="24" y="244" fill="#1f2430" font-weight="600" font-size="13">3. unsupported (6 sound items, 36 calls per prompt)</text>
<text x="234" y="268" text-anchor="end" fill="#5b6272" font-size="12">Prompt A (no definitions)</text>
<rect x="244" y="254" width="162" height="18" fill="#1f2430" opacity="0.10"/>
<rect x="244" y="254" width="4.5" height="18" fill="#8a8f98"/>
<text x="416" y="268" fill="#1f2430" font-size="12">1 of 36 refused</text>

<text x="234" y="292" text-anchor="end" fill="#5b6272" font-size="12">Prompt B (with definitions)</text>
<rect x="244" y="278" width="162" height="18" fill="#1f2430" opacity="0.10"/>
<rect x="244" y="278" width="27" height="18" fill="#b4532a"/>
<text x="416" y="292" fill="#b4532a" font-weight="600" font-size="12">6 of 36 refused</text>
</svg>
