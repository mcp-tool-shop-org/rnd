<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 320" font-family="system-ui, sans-serif" font-size="14" role="img" aria-label="Log-log chart of prefill time against prompt length for phi3.5 Q4_K_M at 1 request: on ladder v3 (RTX 5090, cache off), prefill grows from 23 ms at 512 tokens to 100 ms at 2k, 463 ms at 8k, 1,244 ms at 16k, and 3,791 ms at 32k; on ladder v2 (Colab T4, cached prompt), readings stayed flat at 15 ms at 512 tokens and 33 ms at 8k.">
  <rect width="688" height="320" fill="#ffffff"/>

  <text x="344" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2430">Real prefill grows with the prompt; the cached ladder stayed flat</text>
  <text x="344" y="48" text-anchor="middle" font-size="12" fill="#5b6272">phi3.5 Q4_K_M, 1 request: ladder v3 on RTX 5090 (cache off) vs ladder v2 on Colab T4 (cached)</text>

  <!-- Left panel: log-log plot (x=25..449) -->
  <rect x="25" y="62" width="424" height="220" rx="4" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="39" y="82" font-size="12.5" font-weight="600" fill="#1f2430">Prefill time against prompt cell (log-log scale, ms)</text>

  <!-- Horizontal gridlines -->
  <line x1="88" y1="108.7" x2="418" y2="108.7" stroke="#8a8f98" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="88" y1="138.2" x2="418" y2="138.2" stroke="#8a8f98" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="88" y1="187.1" x2="418" y2="187.1" stroke="#8a8f98" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="88" y1="236.0" x2="418" y2="236.0" stroke="#8a8f98" stroke-width="1.5"/>

  <!-- Vertical reference lines at measured cells -->
  <line x1="88.0" y1="94" x2="88.0" y2="236.0" stroke="#8a8f98" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="198.0" y1="94" x2="198.0" y2="236.0" stroke="#8a8f98" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="308.0" y1="94" x2="308.0" y2="236.0" stroke="#8a8f98" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="363.0" y1="94" x2="363.0" y2="236.0" stroke="#8a8f98" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="418.0" y1="94" x2="418.0" y2="236.0" stroke="#8a8f98" stroke-width="1" stroke-dasharray="2,3"/>

  <!-- Y-axis labels -->
  <text x="80" y="112.7" text-anchor="end" font-size="11" fill="#5b6272">4,000 ms</text>
  <text x="80" y="142.2" text-anchor="end" font-size="11" fill="#5b6272">1,000 ms</text>
  <text x="80" y="191.1" text-anchor="end" font-size="11" fill="#5b6272">100 ms</text>
  <text x="80" y="240.0" text-anchor="end" font-size="11" fill="#5b6272">10 ms</text>

  <!-- Series lines -->
  <polyline fill="none" stroke="#2f7d5b" stroke-width="2.5" points="88.0,218.1 198.0,187.0 308.0,154.5 363.0,133.5 418.0,109.9"/>
  <polyline fill="none" stroke="#b4532a" stroke-width="2" stroke-dasharray="5,3" points="88.0,227.0 308.0,210.5"/>

  <!-- Series 1 points and labels: RTX 5090, ladder v3 -->
  <circle cx="88.0" cy="218.1" r="4" fill="#2f7d5b"/>
  <text x="94.0" y="207.1" font-size="11.5" font-weight="600" fill="#2f7d5b">23 ms</text>

  <circle cx="198.0" cy="187.0" r="4" fill="#2f7d5b"/>
  <text x="190.0" y="180.0" text-anchor="end" font-size="11.5" font-weight="600" fill="#2f7d5b">100 ms</text>

  <circle cx="308.0" cy="154.5" r="4" fill="#2f7d5b"/>
  <text x="300.0" y="147.5" text-anchor="end" font-size="11.5" font-weight="600" fill="#2f7d5b">463 ms</text>

  <circle cx="363.0" cy="133.5" r="4" fill="#2f7d5b"/>
  <text x="355.0" y="126.5" text-anchor="end" font-size="11.5" font-weight="600" fill="#2f7d5b">1,244 ms</text>

  <circle cx="418.0" cy="109.9" r="4" fill="#2f7d5b"/>
  <text x="412.0" y="102.9" text-anchor="end" font-size="11.5" font-weight="600" fill="#2f7d5b">3,791 ms</text>

  <!-- Series 2 points and labels: Colab T4, ladder v2 (cached) -->
  <circle cx="88.0" cy="227.0" r="4" fill="#b4532a"/>
  <text x="104.0" y="240.0" font-size="11.5" font-weight="600" fill="#b4532a">15 ms</text>

  <circle cx="308.0" cy="210.5" r="4" fill="#b4532a"/>
  <text x="308.0" y="202.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b4532a">33 ms (cached)</text>

  <!-- X-axis cell labels -->
  <text x="88.0" y="254" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2430">512</text>
  <text x="198.0" y="254" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2430">2k</text>
  <text x="308.0" y="254" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2430">8k</text>
  <text x="363.0" y="254" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2430">16k</text>
  <text x="418.0" y="254" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2430">32k</text>
  <text x="253.0" y="272" text-anchor="middle" font-size="11" fill="#5b6272">Target prompt cell (tokens, log2 spacing)</text>

  <!-- Right panel: series key by card and ladder (x=461..663) -->
  <rect x="461" y="62" width="202" height="220" rx="4" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="562" y="82" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2430">Series by card &amp; ladder</text>

  <!-- Card 1: RTX 5090, ladder v3 -->
  <rect x="473" y="92" width="178" height="74" rx="4" fill="#ffffff" stroke="#2f7d5b" stroke-width="1.5"/>
  <text x="562" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#2f7d5b">RTX 5090 · ladder v3</text>
  <text x="562" y="126" text-anchor="middle" font-size="11" fill="#1f2430">Unique prefix (cache off)</text>
  <text x="562" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2430">512 → 8k: 23 → 463 ms (20×)</text>
  <text x="562" y="157" text-anchor="middle" font-size="11" fill="#5b6272">32k: 3,791 ms (164× of 512)</text>

  <!-- Card 2: Colab T4, ladder v2 -->
  <rect x="473" y="176" width="178" height="74" rx="4" fill="#ffffff" stroke="#b4532a" stroke-width="1.5"/>
  <text x="562" y="194" text-anchor="middle" font-size="12" font-weight="600" fill="#b4532a">Colab T4 · ladder v2</text>
  <text x="562" y="210" text-anchor="middle" font-size="11" fill="#1f2430">Same prompt (cache hit)</text>
  <text x="562" y="226" text-anchor="middle" font-size="11" font-weight="600" fill="#b4532a">512 → 8k: 15 → 33 ms (2.2×)</text>
  <text x="562" y="241" text-anchor="middle" font-size="11" fill="#5b6272">16k &amp; 32k: cut in half</text>

  <text x="562" y="269" text-anchor="middle" font-size="11" fill="#5b6272">Different cards; shapes only</text>

  <text x="344" y="302" text-anchor="middle" font-size="12" fill="#5b6272">Evaluated tokens: 514, 2,067, 8,283, 16,574 and 33,158 on RTX 5090; 512 and 8,287 on Colab T4.</text>
</svg>
