<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 300" role="img" aria-label="Breakdown of the 327-second G4 window for the two-armed robot checkpoint showing 29.1 seconds of open-loop rollout inference at 31.0 frames per second against the 20.6 frames per second model card figure, and the planned closed-loop control rung" font-family="system-ui, sans-serif" font-size="14">
<rect width="688" height="300" fill="#ffffff"/>
<text x="344" y="32" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="15">Two-armed robot checkpoint on one G4: 29.1 s of inference in a 327 s window</text>
<text x="344" y="50" text-anchor="middle" fill="#5b6272" font-size="12">One 30-second open-loop rollout (901 frames at 832×480, 0.81 compute units, 51,980 MB peak)</text>

<!-- Window breakdown against 327 s (5 min 27 s) denominator -->
<text x="198" y="88" text-anchor="end" fill="#1f2430" font-size="12">Environment &amp; JIT setup</text>
<rect x="208" y="74" width="280" height="18" fill="#1f2430" opacity="0.10"/>
<rect x="208" y="74" width="94.9" height="18" fill="#8a8f98"/>
<text x="498" y="88" fill="#1f2430" font-size="12">110.8 s of 327 s</text>

<text x="198" y="114" text-anchor="end" fill="#1f2430" font-size="12">Download (31.8 GB)</text>
<rect x="208" y="100" width="280" height="18" fill="#1f2430" opacity="0.10"/>
<rect x="208" y="100" width="78.1" height="18" fill="#8a8f98"/>
<text x="498" y="114" fill="#1f2430" font-size="12">91.2 s (348.9 MB/s)</text>

<text x="198" y="140" text-anchor="end" fill="#1f2430" font-size="12">Server start &amp; warmup</text>
<rect x="208" y="126" width="280" height="18" fill="#1f2430" opacity="0.10"/>
<rect x="208" y="126" width="30.0" height="18" fill="#8a8f98"/>
<text x="498" y="140" fill="#1f2430" font-size="12">35.0 s of 327 s</text>

<text x="198" y="166" text-anchor="end" fill="#1f2430" font-weight="600" font-size="12">Rollout inference (901 fr)</text>
<rect x="208" y="152" width="280" height="18" fill="#1f2430" opacity="0.10"/>
<rect x="208" y="152" width="24.9" height="18" fill="#2f7d5b"/>
<text x="498" y="166" fill="#1f2430" font-weight="600" font-size="12">29.1 s (31.0 frames/s)</text>

<!-- Bottom left card: 31.0 vs 20.6 frames/s -->
<rect x="24" y="188" width="312" height="68" rx="4" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
<text x="36" y="207" fill="#1f2430" font-weight="600" font-size="12">480p rollout rate on one RTX PRO 6000</text>
<text x="36" y="227" fill="#1f2430" font-size="11.5">Measured (1 run)</text>
<rect x="150" y="216" width="110.0" height="13" fill="#2f7d5b"/>
<text x="266" y="227" fill="#1f2430" font-weight="600" font-size="11.5">31.0 fps</text>
<text x="36" y="246" fill="#1f2430" font-size="11.5">Model card figure</text>
<rect x="150" y="235" width="73.1" height="13" fill="#8a8f98"/>
<text x="229" y="246" fill="#1f2430" font-size="11.5">20.6 fps</text>

<!-- Bottom right card: Planned closed-loop control -->
<rect x="348" y="188" width="316" height="68" rx="4" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="506" y="207" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="12">Next rung: closed-loop control</text>
<text x="506" y="226" text-anchor="middle" fill="#5b6272" font-size="11">This run plays back a fixed action file</text>
<text x="506" y="245" text-anchor="middle" fill="#5b6272" font-weight="600" font-size="11">Planned · not yet measured</text>

<text x="344" y="278" text-anchor="middle" fill="#5b6272" font-size="12">Session open, VM gate, server stop, and fetch take the remaining 60.9 s of the 327 s window.</text>
</svg>
