<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 336" role="img" aria-label="Three outside-keying rounds reducing arguable pairs from 120 of 1,000 to 16 of 560 to 0 of 60, followed by the two-reader certification rerun raising certified sets from 26 of 50 to 44 of 50, with length stops on one reader at 25 full and 22 medium on old sets and 2 at medium on repaired sets" font-family="system-ui, sans-serif" font-size="14">
<rect width="688" height="336" fill="#ffffff"/>
<text x="344" y="32" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="15">Three outside-keying rounds and the certification rerun across 50 sets</text>
<text x="344" y="50" text-anchor="middle" fill="#5b6272" font-size="12">Each keying round has its own denominator; certification requires outside key + both readers</text>

<!-- Stage 1: Round 1 (1,000 pairs) -->
<rect x="24" y="68" width="192" height="78" rx="4" fill="#ffffff" stroke="#b4532a" stroke-width="1.5"/>
<text x="120" y="87" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="12.5">1. Keying round 1</text>
<text x="120" y="104" text-anchor="middle" fill="#5b6272" font-size="11">All 50 sets: 1,000 pairs</text>
<rect x="40" y="112" width="160" height="10" fill="#1f2430" opacity="0.10"/>
<rect x="40" y="112" width="140.8" height="10" fill="#2f7d5b"/>
<rect x="180.8" y="112" width="19.2" height="10" fill="#b4532a"/>
<text x="120" y="137" text-anchor="middle" fill="#b4532a" font-weight="600" font-size="11">120 of 1,000 arguable</text>

<line x1="216" y1="107" x2="248" y2="107" stroke="#8a8f98" stroke-width="1.8"/>
<polygon points="248,107 240,103 240,111" fill="#8a8f98"/>

<!-- Stage 2: Round 2 (560 pairs) -->
<rect x="248" y="68" width="192" height="78" rx="4" fill="#ffffff" stroke="#b4532a" stroke-width="1.5"/>
<text x="344" y="87" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="12.5">2. Keying round 2</text>
<text x="344" y="104" text-anchor="middle" fill="#5b6272" font-size="11">28 sets re-keyed: 560 pairs</text>
<rect x="264" y="112" width="160" height="10" fill="#1f2430" opacity="0.10"/>
<rect x="264" y="112" width="155.4" height="10" fill="#2f7d5b"/>
<rect x="419.4" y="112" width="4.6" height="10" fill="#b4532a"/>
<text x="344" y="137" text-anchor="middle" fill="#b4532a" font-weight="600" font-size="11">16 of 560 arguable</text>

<line x1="440" y1="107" x2="472" y2="107" stroke="#8a8f98" stroke-width="1.8"/>
<polygon points="472,107 464,103 464,111" fill="#8a8f98"/>

<!-- Stage 3: Round 3 (60 pairs) -->
<rect x="472" y="68" width="192" height="78" rx="4" fill="#ffffff" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="568" y="87" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="12.5">3. Keying round 3</text>
<text x="568" y="104" text-anchor="middle" fill="#5b6272" font-size="11">3 sets re-keyed: 60 pairs</text>
<rect x="488" y="112" width="160" height="10" fill="#1f2430" opacity="0.10"/>
<rect x="488" y="112" width="160" height="10" fill="#2f7d5b"/>
<text x="568" y="137" text-anchor="middle" fill="#2f7d5b" font-weight="600" font-size="11">0 of 60 arguable (all pass)</text>

<!-- Part 2: Two-reader certification bar-share -->
<text x="24" y="170" fill="#1f2430" font-weight="600" font-size="12.5">Two-reader certification (50 sets, 2,000 reader calls, 0 failed)</text>

<text x="176" y="196" text-anchor="end" fill="#1f2430" font-size="12">Before repair (50 sets)</text>
<rect x="184" y="181" width="180" height="20" fill="#1f2430" opacity="0.10"/>
<rect x="184" y="181" width="93.6" height="20" fill="#8a8f98"/>
<rect x="184" y="181" width="10.8" height="20" fill="#2f7d5b"/>
<text x="374" y="196" fill="#1f2430" font-size="11.5">26 of 50 certified (3 of 26 clean on key)</text>

<text x="176" y="224" text-anchor="end" fill="#1f2430" font-weight="600" font-size="12">After repair (50 sets)</text>
<rect x="184" y="209" width="180" height="20" fill="#1f2430" opacity="0.10"/>
<rect x="184" y="209" width="158.4" height="20" fill="#2f7d5b"/>
<rect x="342.4" y="209" width="21.6" height="20" fill="#b4532a"/>
<text x="374" y="224" fill="#1f2430" font-weight="600" font-size="11.5">44 of 50 certified (9 of 10 sampled clean)</text>

<!-- Bottom cards: 6 queued sets & thinking setting -->
<rect x="24" y="240" width="296" height="54" rx="4" fill="#ffffff" stroke="#b4532a" stroke-width="1.5"/>
<text x="34" y="259" fill="#1f2430" font-weight="600" font-size="12">Why 6 sets were queued (11 refused pairs)</text>
<text x="34" y="279" fill="#5b6272" font-size="11">6 pair faults · 5 reader mistakes (3 and 2)</text>

<rect x="332" y="240" width="332" height="54" rx="4" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
<text x="344" y="259" fill="#1f2430" font-weight="600" font-size="11.5">Length stops (one reader): old sets 25 at full,</text>
<text x="344" y="279" fill="#5b6272" font-size="11.5">22 at medium; repaired sets 2 at medium</text>

<text x="344" y="316" text-anchor="middle" fill="#5b6272" font-size="12">Sample read of 10 certified sets found 9 clean and 1 mild wording note (vs 5 of 10 before).</text>
</svg>
