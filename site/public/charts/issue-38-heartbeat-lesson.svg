<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 286" role="img" aria-label="Two-row process map showing the watchdog heartbeat lesson: before, the loop wrote the heartbeat whether or not it read the card; after, the heartbeat is written only after a reading parses, and five bad readings in a row write a blind marker" font-family="system-ui, sans-serif" font-size="14">
<rect width="688" height="286" fill="#ffffff"/>
<text x="344" y="32" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="15">A heartbeat should prove the work happened</text>
<text x="344" y="52" text-anchor="middle" fill="#5b6272" font-size="12">Before, the loop wrote the heartbeat unconditionally; after, only when a card reading parses</text>
<rect x="25" y="72" width="187" height="76" rx="4" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
<text x="118.5" y="96" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="13">Before: poll card</text>
<text x="118.5" y="116" text-anchor="middle" fill="#5b6272" font-size="11.5">Watchdog loop polls the</text>
<text x="118.5" y="133" text-anchor="middle" fill="#5b6272" font-size="11.5">card for a reading</text>
<line x1="212" y1="110" x2="250" y2="110" stroke="#b4532a" stroke-width="1.8"/>
<polygon points="250,110 242,106 242,114" fill="#b4532a"/>
<rect x="250" y="72" width="188" height="76" rx="4" fill="#ffffff" stroke="#b4532a" stroke-width="1.5"/>
<text x="344" y="96" text-anchor="middle" fill="#b4532a" font-weight="600" font-size="13">Read fails or parses</text>
<text x="344" y="116" text-anchor="middle" fill="#5b6272" font-size="11.5">Whether or not the loop</text>
<text x="344" y="133" text-anchor="middle" fill="#b4532a" font-weight="600" font-size="11.5">actually read the card</text>
<line x1="438" y1="110" x2="476" y2="110" stroke="#b4532a" stroke-width="1.8"/>
<polygon points="476,110 468,106 468,114" fill="#b4532a"/>
<rect x="476" y="72" width="187" height="76" rx="4" fill="#ffffff" stroke="#b4532a" stroke-width="1.5"/>
<text x="569.5" y="96" text-anchor="middle" fill="#b4532a" font-weight="600" font-size="13">Heartbeat written</text>
<text x="569.5" y="116" text-anchor="middle" fill="#5b6272" font-size="11.5">Wrote the heartbeat whether</text>
<text x="569.5" y="133" text-anchor="middle" fill="#b4532a" font-weight="600" font-size="11.5">or not it read the card</text>
<rect x="25" y="168" width="187" height="76" rx="4" fill="#ffffff" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="118.5" y="192" text-anchor="middle" fill="#2f7d5b" font-weight="600" font-size="13">After: reading parses</text>
<text x="118.5" y="212" text-anchor="middle" fill="#5b6272" font-size="11.5">Heartbeat is written only</text>
<text x="118.5" y="229" text-anchor="middle" fill="#2f7d5b" font-weight="600" font-size="11.5">after a reading parses</text>
<rect x="250" y="168" width="188" height="76" rx="4" fill="#ffffff" stroke="#b4532a" stroke-width="1.5"/>
<text x="344" y="192" text-anchor="middle" fill="#b4532a" font-weight="600" font-size="13">After: bad reading</text>
<text x="344" y="212" text-anchor="middle" fill="#5b6272" font-size="11.5">Unparsed card reading writes</text>
<text x="344" y="229" text-anchor="middle" fill="#b4532a" font-weight="600" font-size="11.5">no heartbeat update</text>
<line x1="438" y1="206" x2="476" y2="206" stroke="#b4532a" stroke-width="1.8"/>
<polygon points="476,206 468,202 468,210" fill="#b4532a"/>
<rect x="476" y="168" width="187" height="76" rx="4" fill="#ffffff" stroke="#b4532a" stroke-width="1.5"/>
<text x="569.5" y="192" text-anchor="middle" fill="#b4532a" font-weight="600" font-size="13">Blind marker written</text>
<text x="569.5" y="212" text-anchor="middle" fill="#b4532a" font-weight="600" font-size="11.5">Five bad readings in a row</text>
<text x="569.5" y="229" text-anchor="middle" fill="#5b6272" font-size="11.5">write a &quot;blind&quot; marker</text>
<text x="344" y="266" text-anchor="middle" fill="#5b6272" font-size="11.5">Green marks the verified reading path; rust marks the failing path.</text>
</svg>
