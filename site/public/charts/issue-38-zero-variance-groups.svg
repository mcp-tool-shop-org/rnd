<text x="424" y="115" text-anchor="middle" fill="#ffffff" font-weight="600" font-size="12.5">30 of 40 groups (75%): active reward variance</text>
<text x="24" y="144" text-anchor="start" fill="#b4532a" font-weight="600" font-size="12">Zero reward variance: no policy gradient (8 of 10 steps had mean reward +0.89 to +1.04)</text>
<rect x="25" y="160" width="638" height="68" rx="4" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="344" y="183" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="13">Fix built in aspire-si #181 · first results to follow</text>
<text x="344" y="203" text-anchor="middle" fill="#5b6272" font-size="11.5">Leave zero-variance groups out of the whole loss (KL term included) and mean-centre</text>
<text x="344" y="219" text-anchor="middle" fill="#5b6272" font-size="11.5">advantages without dividing by group standard deviation (built, not yet reported).</text>
<text x="344" y="250" text-anchor="middle" fill="#5b6272" font-size="11.5">Whisker marks the 95% confidence interval on 10/40 (25%); dashed border marks the fix.</text>
