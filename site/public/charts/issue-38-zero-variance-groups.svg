<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 272" role="img" aria-label="Bar share chart showing 10 of 40 prompt groups (25%) with zero reward variance in S2 path a, with Wilson 95% confidence interval 14.2% to 40.2% and Clopper-Pearson 95% interval 12.7% to 41.2%" font-family="system-ui, sans-serif" font-size="14">
