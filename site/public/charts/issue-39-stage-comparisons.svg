<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 332" role="img" aria-label="Dot plot comparing udlab Stage 3, Stage 4, and Stage 5 development-bank pass counts out of 160 renderings against each stage's comparator: Stage 3 passed 111 against 127 for the baseline prompt, Stage 4 passed 89 against 120 for the baseline with 16 renderings per arm never generated due to the context limit, and Stage 5 passed 126 on first drafts and 132 after the pipeline against a pre-registered floor of 112" font-family="system-ui, sans-serif" font-size="14">
<rect width="688" height="332" fill="#ffffff"/>
<text x="344" y="30" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="15">Two stages lost to their baseline; Stage 5 cleared its pre-registered floor</text>
<text x="344" y="49" text-anchor="middle" fill="#5b6272" font-size="12">Renderings passing the code check out of 160 per development bank (prototype)</text>

<!-- Legend row (spans x=24..664) -->
<circle cx="29" cy="70" r="4.5" fill="#b4532a"/>
<text x="38" y="74" fill="#1f2430" font-size="11.5">Stage 3 &amp; 4 arm (not adopted)</text>
<circle cx="236" cy="70" r="4.5" fill="#8a8f98"/>
<text x="245" y="74" fill="#1f2430" font-size="11.5">Measured baseline arm</text>
<circle cx="398" cy="70" r="4.5" fill="#2f7d5b"/>
<text x="407" y="74" fill="#1f2430" font-size="11.5">Stage 5 arm</text>
<line x1="502" y1="62" x2="502" y2="78" stroke="#1f2430" stroke-width="1.8" stroke-dasharray="3,2"/>
<text x="664" y="74" text-anchor="end" fill="#1f2430" font-weight="600" font-size="11.5">Pre-registered floor (112)</text>
<line x1="24" y1="84" x2="664" y2="84" stroke="#8a8f98" stroke-width="1"/>

<!-- Row 1: Stage 3 (111 vs 127 baseline prompt) -->
<text x="24" y="106" fill="#1f2430" font-weight="600" font-size="12">Stage 3 · Accepted-forms list</text>
<text x="24" y="121" fill="#5b6272" font-size="11">List of forms in writer prompt</text>
<rect x="244" y="104" width="256" height="12" rx="6" fill="#1f2430" opacity="0.10"/>
<line x1="421.6" y1="110" x2="447.2" y2="110" stroke="#b4532a" stroke-width="2.5"/>
