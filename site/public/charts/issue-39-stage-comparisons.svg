<text x="664" y="238" text-anchor="end" fill="#2f7d5b" font-weight="600" font-size="12">132 vs 112 floor</text>
<text x="664" y="253" text-anchor="end" fill="#5b6272" font-size="11">After pipeline (+20 vs floor)</text>

<!-- Bottom axis and ticks -->
<line x1="24" y1="266" x2="664" y2="266" stroke="#8a8f98" stroke-width="1"/>
<line x1="244.0" y1="266" x2="244.0" y2="271" stroke="#1f2430" stroke-width="1"/>
<text x="244.0" y="283" text-anchor="middle" fill="#5b6272" font-size="11">0</text>
