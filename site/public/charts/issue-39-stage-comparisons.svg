<line x1="372.0" y1="266" x2="372.0" y2="271" stroke="#1f2430" stroke-width="1"/>
<text x="372.0" y="283" text-anchor="middle" fill="#5b6272" font-size="11">80</text>
<line x1="436.0" y1="266" x2="436.0" y2="271" stroke="#1f2430" stroke-width="1"/>
<text x="436.0" y="283" text-anchor="middle" fill="#5b6272" font-size="11">120</text>
<line x1="500.0" y1="266" x2="500.0" y2="271" stroke="#1f2430" stroke-width="1"/>
<text x="500.0" y="283" text-anchor="middle" fill="#5b6272" font-size="11">160 renderings</text>
<text x="344" y="303" text-anchor="middle" fill="#5b6272" font-size="11.5">*Stage 4: 16 renderings per arm (10%) were never generated (over context limit), counted in 160.</text>
<text x="344" y="319" text-anchor="middle" fill="#5b6272" font-size="11.5">Stage 5 kept 2,501/2,501 code swaps and 350/358 speech rewrites (97.8%); 0 over context limit.</text>
</svg>
