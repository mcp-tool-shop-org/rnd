<text x="455.2" y="114" fill="#5b6272" font-weight="600" font-size="11.5">127</text>
<text x="664" y="106" text-anchor="end" fill="#b4532a" font-weight="600" font-size="12">111 vs 127 baseline</text>
<text x="664" y="121" text-anchor="end" fill="#5b6272" font-size="11">Not adopted (pre-reg. rule)</text>

<!-- Row 2: Stage 4 (89 vs 120 baseline; 16/arm never generated) -->
<text x="24" y="150" fill="#1f2430" font-weight="600" font-size="12">Stage 4 · Shapes assigned by code</text>
<text x="24" y="165" fill="#b4532a" font-weight="600" font-size="11">16/arm (10%) never generated*</text>
<rect x="244" y="148" width="256" height="12" rx="6" fill="#1f2430" opacity="0.10"/>
<line x1="386.4" y1="154" x2="436.0" y2="154" stroke="#b4532a" stroke-width="2.5"/>
<circle cx="436.0" cy="154" r="5.5" fill="#8a8f98"/>
<circle cx="386.4" cy="154" r="5.5" fill="#b4532a"/>
<text x="378.4" y="158" text-anchor="end" fill="#b4532a" font-weight="600" font-size="11.5">89</text>
<text x="444.0" y="158" fill="#5b6272" font-weight="600" font-size="11.5">120</text>
<text x="664" y="150" text-anchor="end" fill="#b4532a" font-weight="600" font-size="12">89 vs 120 baseline*</text>
<text x="664" y="165" text-anchor="end" fill="#5b6272" font-size="11">Not adopted (gate failed)</text>

<!-- Comparator change divider: measured baseline arm above, pre-registered floor below -->
<line x1="24" y1="179" x2="664" y2="179" stroke="#8a8f98" stroke-width="0.9" stroke-dasharray="4,3"/>

<!-- Stage 5 pre-registered floor threshold line (112 of 160, not a measured arm) -->
<line x1="423.2" y1="186" x2="423.2" y2="258" stroke="#1f2430" stroke-width="2" stroke-dasharray="4,3"/>
<text x="416.2" y="206" text-anchor="end" fill="#1f2430" font-weight="600" font-size="11">pre-registered floor: 112</text>
<text x="416.2" y="246" text-anchor="end" fill="#5b6272" font-size="11">(threshold, not an arm)</text>

