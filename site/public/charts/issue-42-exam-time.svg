<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 306" role="img" aria-label="Horizontal bar chart comparing the measured 83-minute evaluation pass over 184 items at batch 1 against two arithmetic estimates using a 71 ms decode step: an upper bound of 29.08 minutes on the 12 flagged items and 38.60 minutes for the same pass in 23 batches of 8." font-family="system-ui, sans-serif" font-size="14">
<rect width="688" height="306" fill="#ffffff"/>
<text x="344" y="32" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="15">Up to a third of the 83-minute pass may go to 12 flagged answers; batching by eight only halves it</text>
<text x="344" y="52" text-anchor="middle" fill="#5b6272" font-size="12">Greedy pass over 184 items: measured 1 item at a time vs. arithmetic at 71 ms per step</text>

<rect x="202" y="67" width="18" height="12" fill="#2f7d5b" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="226" y="77" fill="#1f2430" font-size="12">measured</text>
<rect x="306" y="67" width="18" height="12" fill="#ffffff" stroke="#b4532a" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="330" y="77" fill="#1f2430" font-size="12">arithmetic, not measured</text>

<text x="234" y="105" text-anchor="end" fill="#1f2430" font-size="12" font-weight="600">184-item pass, 1 at a time</text>
<text x="234" y="120" text-anchor="end" fill="#5b6272" font-size="11.5">measured greedy pass</text>
<rect x="244" y="96" width="220" height="22" fill="#1f2430" opacity="0.10"/>
<rect x="244" y="96" width="220" height="22" fill="#2f7d5b" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="474" y="105" fill="#1f2430" font-size="12" font-weight="600">83 min (measured)</text>
<text x="474" y="120" fill="#5b6272" font-size="11.5">184 items, batch size 1</text>

<text x="234" y="149" text-anchor="end" fill="#1f2430" font-size="12" font-weight="600">Upper bound on 12 flagged</text>
<text x="234" y="164" text-anchor="end" fill="#5b6272" font-size="11.5">truncated or malformed items</text>
<rect x="244" y="140" width="220" height="22" fill="#1f2430" opacity="0.10"/>
<rect x="244" y="140" width="77.1" height="22" fill="#ffffff" stroke="#b4532a" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="474" y="149" fill="#1f2430" font-size="12" font-weight="600">29.08 min (about 29 min)</text>
<text x="474" y="164" fill="#5b6272" font-size="11.5">12 × 2,048 tokens × 71 ms</text>

<text x="234" y="193" text-anchor="end" fill="#1f2430" font-size="12" font-weight="600">Same pass in batches of 8</text>
<text x="234" y="208" text-anchor="end" fill="#5b6272" font-size="11.5">23 batches (2.15×, not 8×)</text>
<rect x="244" y="184" width="220" height="22" fill="#1f2430" opacity="0.10"/>
<rect x="244" y="184" width="102.3" height="22" fill="#ffffff" stroke="#b4532a" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="474" y="193" fill="#1f2430" font-size="12" font-weight="600">38.60 min (about 38.6 min)</text>
<text x="474" y="208" fill="#5b6272" font-size="11.5">32,617 steps × 71 ms</text>

<text x="344" y="236" text-anchor="middle" fill="#5b6272" font-size="11">"12 flagged" is an upper bound on answers cut at the length limit, not a count of them;</text>
<text x="344" y="252" text-anchor="middle" fill="#5b6272" font-size="11">both arithmetic bars use the 71 ms step measured with 8 answers decoded together (160 rollouts),</text>
<text x="344" y="268" text-anchor="middle" fill="#5b6272" font-size="11">and the step time at one item at a time was inferred from the 83-minute total, not measured. Batching</text>
<text x="344" y="284" text-anchor="middle" fill="#5b6272" font-size="11">gives about 2.15× here, not 8×, because each batch waits for its slowest answer.</text>
</svg>
