<text x="344" y="270" text-anchor="middle" fill="#5b6272" font-size="11">Each E02 arm is one generation; repeats at a fixed seed are bit-identical (zero measurement noise).</text>
<text x="344" y="284" text-anchor="middle" fill="#5b6272" font-size="11">Yardsticks show between-seed movement in E04 (both SDs shown: 0.1689 bright is larger, 0.1571 dark),</text>
<text x="344" y="298" text-anchor="middle" fill="#5b6272" font-size="11">not a confidence interval: bright and dark sit 0.060 apart (inside 1 SD) and 0.586–0.646 from no control.</text>
