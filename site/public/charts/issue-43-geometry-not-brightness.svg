<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 320" role="img" aria-label="Dot-and-bar chart on a timing correlation axis from -1 to +1 comparing the three single-generation E02 arms against the E04 between-seed standard deviation yardsticks. A1a (control present, near-bright) is +0.521; A1b (control present, near-dark) is +0.581 (a 0.060 gap); A2 (no control) is −0.065 (0.586 to 0.646 away from the control arms). Both E04 1-SD between-seed yardsticks are shown: 0.1689 for bright control (larger) and 0.1571 for dark control, showing that the 0.060 bright-versus-dark difference sits well inside one seed SD rather than being a confidence interval." font-family="system-ui, sans-serif" font-size="14">
<rect width="688" height="320" fill="#ffffff"/>
<text x="344" y="32" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="15">The model follows geometry, not brightness: +0.521 and +0.581 vs −0.065</text>
<text x="344" y="50" text-anchor="middle" fill="#5b6272" font-size="12">Timing correlation with the control (E02, 1 generation per arm) vs E04 between-seed SD</text>
