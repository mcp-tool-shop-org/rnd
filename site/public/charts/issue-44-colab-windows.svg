<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="24" y="30" font-size="15.5" font-weight="bold" fill="#111827">Sixteen Colab windows on 12 November cost 3.9 units, and most of what they taught us was cheap</text>
  <g font-size="12" fill="#111827">
    <rect x="24" y="47" width="12" height="12" fill="#0f766e"/>
    <text x="42" y="57">ran</text>
    <rect x="88" y="47" width="12" height="12" fill="#9ca3af"/>
    <text x="106" y="57">no capacity or refused before work</text>
    <rect x="354" y="47" width="12" height="12" fill="#b91c1c"/>
    <text x="372" y="57">stopped by a guard or by us</text>
  </g>
  <text x="340" y="80" font-size="11.5" font-weight="bold" fill="#111827" text-anchor="end">Colab window</text>
  <g stroke="#9ca3af" stroke-opacity="0.3" stroke-width="1">
