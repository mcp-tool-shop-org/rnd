<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 210" role="img" aria-label="Minimal process-map template example with solid measured stages and a dashed planned stage" font-family="system-ui, sans-serif" font-size="14">
<rect width="688" height="210" fill="#ffffff"/>
<text x="344" y="32" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="15">Process map: stages in sequence, with dashed border for planned work</text>
<text x="344" y="52" text-anchor="middle" fill="#5b6272" font-size="12">Solid borders show measured steps; dashed borders mark unmeasured or planned steps</text>

<!-- Stage 1: Measured -->
<rect x="24" y="80" width="188" height="76" rx="4" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5"/>
<text x="118" y="104" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="13">1. Planner &amp; writer</text>
<text x="118" y="124" text-anchor="middle" fill="#5b6272" font-size="11">60 slots drafted in wave 1</text>
<text x="118" y="141" text-anchor="middle" fill="#b4532a" font-weight="600" font-size="11">7 had contradictory brief</text>

<line x1="212" y1="118" x2="250" y2="118" stroke="#8a8f98" stroke-width="1.8"/>
<polygon points="250,118 242,114 242,122" fill="#8a8f98"/>

<!-- Stage 2: Measured -->
<rect x="250" y="80" width="188" height="76" rx="4" fill="#ffffff" stroke="#b4532a" stroke-width="1.5"/>
<text x="344" y="104" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="13">2. Critic check</text>
<text x="344" y="124" text-anchor="middle" fill="#5b6272" font-size="11">6 of 7 voted T14 (silence)</text>
<text x="344" y="141" text-anchor="middle" fill="#b4532a" font-weight="600" font-size="11">0 of 7 voted T10</text>

<line x1="438" y1="118" x2="476" y2="118" stroke="#8a8f98" stroke-width="1.8" stroke-dasharray="5,3"/>
<polygon points="476,118 468,114 468,122" fill="#8a8f98"/>

<!-- Stage 3: Planned (dashed) -->
<rect x="476" y="80" width="188" height="76" rx="4" fill="#ffffff" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="570" y="104" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="13">3. 30-item bench</text>
<text x="570" y="124" text-anchor="middle" fill="#5b6272" font-size="11">30 items × 3 seeds × 2 arms</text>
<text x="570" y="141" text-anchor="middle" fill="#5b6272" font-weight="600" font-size="11">Planned · not yet measured</text>

<text x="344" y="186" text-anchor="middle" fill="#5b6272" font-size="12">Every planned box carries a dashed border and the words “not yet measured” or “agreed, not built”.</text>
</svg>
