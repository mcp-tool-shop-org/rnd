<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 260" role="img" aria-label="Minimal ranking-coverage template example pairing group medians with top-K recall bars" font-family="system-ui, sans-serif" font-size="14">
<rect width="688" height="260" fill="#ffffff"/>
<text x="344" y="32" text-anchor="middle" fill="#1f2430" font-weight="600" font-size="15">Ranking coverage: group medians versus what a top-N cutoff catches</text>

<text x="24" y="62" fill="#1f2430" font-weight="600" font-size="13">1. Group medians separate (204 calls)</text>
<text x="290" y="88" text-anchor="end" fill="#1f2430" font-size="12">Calls on items that flipped (14 calls)</text>
<rect x="300" y="74" width="270" height="20" fill="#1f2430" opacity="0.10"/>
<rect x="300" y="74" width="240" height="20" fill="#b4532a"/>
<text x="578" y="89" fill="#1f2430" font-weight="600" font-size="12">12 switches</text>

<text x="290" y="116" text-anchor="end" fill="#1f2430" font-size="12">On items that stayed the same (190 calls)</text>
<rect x="300" y="102" width="270" height="20" fill="#1f2430" opacity="0.10"/>
<rect x="300" y="102" width="120" height="20" fill="#8a8f98"/>
<text x="578" y="117" fill="#1f2430" font-size="12">6 switches</text>

<text x="24" y="156" fill="#1f2430" font-weight="600" font-size="13">2. Share of the 7 flipped items caught by a switch-count ranking</text>
<text x="290" y="182" text-anchor="end" fill="#1f2430" font-size="12">Top 10 most hesitant items (of 102)</text>
<rect x="300" y="168" width="270" height="20" fill="#1f2430" opacity="0.10"/>
<rect x="300" y="168" width="38.6" height="20" fill="#b4532a"/>
<text x="578" y="183" fill="#1f2430" font-weight="600" font-size="12">1 of 7 flips</text>

<text x="290" y="210" text-anchor="end" fill="#1f2430" font-size="12">Top 20 most hesitant items (of 102)</text>
<rect x="300" y="196" width="270" height="20" fill="#1f2430" opacity="0.10"/>
<rect x="300" y="196" width="154.3" height="20" fill="#b4532a"/>
<text x="578" y="211" fill="#1f2430" font-weight="600" font-size="12">4 of 7 flips</text>

<text x="344" y="242" text-anchor="middle" fill="#5b6272" font-size="12">Pairs the average gap with top-N recall so a noisy ranking is not mistaken for a gate.</text>
</svg>
